        .toggle-switch {
            position: relative;
            width: 40px;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active {
            background: #007bff;
        }

        .toggle-switch.active::after {
            transform: translateX(20px);
        }

        /* 添加通用的涟漪效果基础样式 */
        .ripple {
            position: relative;
            overflow: hidden;
            transform: translate3d(0, 0, 0);
            -webkit-tap-highlight-color: transparent;
        }

        .ripple::after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #000 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }

        .ripple:active::after {
            transform: scale(0, 0);
            opacity: 0.12;
            transition: 0s;
        }

    <script>
        // 全局变量
        let destinations = [];
        const pageHistory = ['homePage'];

        // 模拟订单数据存储
        let orders = [];
        
        // 初始化订单数据
        function initializeOrders() {
            try {
                const savedOrders = localStorage.getItem('orders');
                orders = savedOrders ? JSON.parse(savedOrders) : [];
                if (!Array.isArray(orders)) {
                    console.error('Invalid orders data format');
                    orders = [];
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                orders = [];
            }
        }

        // 加载目的地数据
        async function loadDestData() {
            try {
                const response = await fetch('./dest.txt');
                if (!response.ok) throw new Error('无法加载目的地数据');
                const text = await response.text();
                return text.trim().split('\n').map(dest => dest.trim());
            } catch (error) {
                console.error('Error loading destination data:', error);
                return ['临东SB客运站'];
            }
        }

        // 加载路线数据
        async function loadRouteData() {
            try {
                const response = await fetch('./route.txt');
                if (!response.ok) throw new Error('无法加载路线数据');
                const text = await response.text();
                const lines = text.trim().split('\n');
                const routes = [];

                let currentRoute = {};
                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    if (trimmedLine.startsWith('[班次]')) {
                        if (Object.keys(currentRoute).length > 0) {
                            routes.push(currentRoute);
                        }
                        currentRoute = {
                            id: trimmedLine.split('] ')[1].trim()
                        };
                    } else if (trimmedLine.startsWith('[发车时间]')) {
                        currentRoute.time = trimmedLine.split('] ')[1].trim();
                    } else if (trimmedLine.startsWith('[线路]')) {
                        const routeInfo = trimmedLine.split('] ')[1].split(' - ').map(s => s.trim());
                        currentRoute.departure = routeInfo[0];
                        currentRoute.arrival = routeInfo[1];
                        currentRoute.line = trimmedLine.split('] ')[1].trim();  // 保存完整的线路信息
                    } else if (trimmedLine.startsWith('[途径]')) {
                        // 添加途径站点解析
                        currentRoute.stations = trimmedLine.split('] ')[1].split(' - ').map(s => s.trim());
                    } else if (trimmedLine.startsWith('[票价]')) {
                        currentRoute.price = parseInt(trimmedLine.split('] ')[1]);
                    } else if (trimmedLine.startsWith('[公司]')) {
                        currentRoute.company = trimmedLine.split('] ')[1].trim();
                    } else if (trimmedLine.startsWith('[链接]')) {
                        currentRoute.link = trimmedLine.split('] ')[1].trim();
                    }
                });

                if (Object.keys(currentRoute).length > 0) {
                    routes.push(currentRoute);
                }

                // 确保每个路线都有stations属性
                routes.forEach(route => {
                    if (!route.stations) {
                        route.stations = [route.departure, route.arrival];
                    }
                    // 确保起始站和终点站也在stations列表中
                    if (!route.stations.includes(route.departure)) {
                        route.stations.unshift(route.departure);
                    }
                    if (!route.stations.includes(route.arrival)) {
                        route.stations.push(route.arrival);
                    }
                });

                return { routes };
            } catch (error) {
                console.error('Error loading route data:', error);
                return { routes: [] };
            }
        }

        // 初始化下拉框
        async function initSelects() {
            try {
                // 只从dest.txt加载站点数据
                const stations = await loadDestData();
                destinations = stations; // 更新全局变量
                
                // 更新下拉列表
                updateDropdownList('departureDropdown', stations);
                updateDropdownList('arrivalDropdown', stations);
                
                // 更新输入框事件绑定
                ['departureSelect', 'arrivalSelect'].forEach(id => {
                    const input = document.getElementById(id);
                    const dropdownId = id.replace('Select', 'Dropdown');
                    const dropdown = document.getElementById(dropdownId);
                    
                    // 输入事件
                    input.addEventListener('input', () => {
                        const value = input.value.trim().toLowerCase();
                        if (value) {
                            const filteredStations = destinations.filter(station => 
                                station.toLowerCase().includes(value)
                            );
                            updateDropdownList(dropdownId, filteredStations);
                            dropdown.classList.add('show');
                        } else {
                            dropdown.classList.remove('show');
                        }
                    });

                    // 失去焦点事件
                    input.addEventListener('blur', (e) => {
                        // 给下拉列表点击一个缓冲时间
                        setTimeout(() => {
                            dropdown.classList.remove('show');
                        }, 200);
                    });
                });
                
                // 绑定查询按钮事件
                document.getElementById('searchBtn').addEventListener('click', async () => {
                    const departure = document.getElementById('departureSelect').value;
                    const arrival = document.getElementById('arrivalSelect').value;
                    
                    if (!departure || !arrival) {
                        await showModal('请选择出发地和目的地');
                        return;
                    }

                    if (departure === arrival) {
                        await showModal('出发地和目的地不能相同');
                        return;
                    }

                    // 验证输入的站点是否在dest.txt中
                    if (!stations.includes(departure) || !stations.includes(arrival)) {
                        await showModal('请选择有效的站点');
                        return;
                    }
                    
                    try {
                        // 加载路线数据并查找匹配的路线
                        const { routes } = await loadRouteData();
                        const matchedRoutes = routes.filter(route => {
                            if (!route.stations) return false;
                            const stations = route.stations;
                            const departureIndex = stations.indexOf(departure);
                            const arrivalIndex = stations.indexOf(arrival);
                            // 确保出发站在到达站之前
                            return departureIndex !== -1 && arrivalIndex !== -1 && departureIndex < arrivalIndex;
                        }).map(route => ({
                            ...route,
                            departure: departure,
                            arrival: arrival
                        }));

                        if (matchedRoutes.length === 0) {
                            await showModal('暂无该线路！');
                            return;
                        }

                        // 存储当前路线信息
                        sessionStorage.setItem('currentRoute', JSON.stringify({
                            departure: departure,
                            arrival: arrival
                        }));

                        showTicketPage(departure, arrival, matchedRoutes);
                    } catch (error) {
                        console.error('Error searching routes:', error);
                        await showModal('查询失败，请重试');
                    }
                });
                
                return true;
            } catch (error) {
                console.error('Error initializing selects:', error);
                document.getElementById('loadingError').style.display = 'block';
                return false;
            }
        }

        // 更新下拉列表
        function updateDropdownList(dropdownId, items) {
            const dropdown = document.getElementById(dropdownId);
            dropdown.innerHTML = '';
            
            if (items.length === 0) {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.style.color = '#999';
                div.textContent = '无匹配站点';
                dropdown.appendChild(div);
                return;
            }
            
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item;
                div.onclick = () => {
                    const input = document.getElementById(dropdownId.replace('Dropdown', 'Select'));
                    input.value = item;
                    dropdown.classList.remove('show');
                };
                dropdown.appendChild(div);
            });
        }

        // 切换下拉列表显示状态
        function toggleDropdown(dropdownId) {
            const dropdown = document.getElementById(dropdownId);
            const allDropdowns = document.querySelectorAll('.dropdown-list');
            const input = document.getElementById(dropdownId.replace('Dropdown', 'Select'));
            
            // 关闭其他下拉列表
            allDropdowns.forEach(d => {
                if (d.id !== dropdownId) {
                    d.classList.remove('show');
                }
            });
            
            // 切换当前下拉列表
            if (dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
            } else {
                // 显示所有选项
                updateDropdownList(dropdownId, destinations);
                dropdown.classList.add('show');
            }
        }

        // 更新显示模态框函数
        function showModal(title, options = {}) {
            return new Promise(function(resolve) {
                const modalOverlay = document.getElementById('modalOverlay');
                const modalContent = document.getElementById('modalContent');
                const modalButtons = document.getElementById('modalButtons');
                const modalTitle = document.querySelector('.modal-title');
                
                modalTitle.textContent = title;
                modalContent.innerHTML = options.content || '';
                
                // 更新按钮
                modalButtons.innerHTML = '';
                
                if (options.showCancel) {
                    const cancelButton = document.createElement('button');
                    cancelButton.className = 'modal-button secondary';
                    cancelButton.textContent = options.cancelText || '取消';
                    cancelButton.onclick = function() {
                        modalOverlay.classList.remove('show');
                        setTimeout(function() {
                            modalOverlay.style.display = 'none';
                        }, 300);
                        resolve(false);
                    };
                    modalButtons.appendChild(cancelButton);
                }
                
                const confirmButton = document.createElement('button');
                confirmButton.className = 'modal-button ' + (options.type === 'danger' ? 'danger' : 'primary');
                confirmButton.textContent = options.confirmText || '确定';
                confirmButton.onclick = function() {
                    modalOverlay.classList.remove('show');
                    setTimeout(function() {
                        modalOverlay.style.display = 'none';
                    }, 300);
                    resolve(true);
                };
                modalButtons.appendChild(confirmButton);
                
                // 显示模态框
                modalOverlay.style.display = 'flex';
                setTimeout(function() {
                    modalOverlay.classList.add('show');
                }, 10);
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 初始化
            document.body.classList.add('at-home');
            initSelects();

            // 绑定交换按钮事件
            document.getElementById('swapBtn').addEventListener('click', () => {
                const departureSelect = document.getElementById('departureSelect');
                const arrivalSelect = document.getElementById('arrivalSelect');
                const temp = departureSelect.value;
                departureSelect.value = arrivalSelect.value;
                arrivalSelect.value = temp;
            });

            // 绑定返回按钮事件
            document.getElementById('backBtn').addEventListener('click', handleBack);

            // 绑定底部导航事件
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    e.preventDefault();
                    const pageName = tab.dataset.page;
                    
                    document.querySelectorAll('.main-content > div').forEach(page => {
                        page.style.display = 'none';
                    });
                    
                    if (pageName !== 'profilePage') {
                        document.getElementById(pageName).style.display = 'block';
                    }
                    
                    pageHistory.push(pageName);
                    updatePageTitle(pageName);
                    updateBottomNav(pageName);
                });
            });

            // 检查是否需要显示已退票列表
            if (sessionStorage.getItem('showRefunded') === 'true') {
                // 清除标记
                sessionStorage.removeItem('showRefunded');
                
                // 显示行程页面
                showPage('tripsPage');
                
                // 更新筛选器按钮状态
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.filter === 'refunded') {
                        btn.classList.add('active');
                    }
                });
                
                // 显示已退票列表
                showTripsList('refunded');
            }

            // 在页面加载时检查并恢复状态
            const currentPage = localStorage.getItem('currentPage');
            const currentFilter = localStorage.getItem('currentFilter');
            
            if (currentPage === 'tripsPage' && currentFilter === 'refunded') {
                // 清除状态
                localStorage.removeItem('currentPage');
                localStorage.removeItem('currentFilter');
                
                // 切换到行程页面
                showPage('tripsPage');
                
                // 更新底部导航栏状态
                document.querySelectorAll('.tab-item').forEach(tab => {
                    tab.classList.remove('active');
                    if (tab.dataset.page === 'tripsPage') {
                        tab.classList.add('active');
                    }
                });
                
                // 更新筛选器状态并显示已退票列表
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.filter === 'refunded') {
                        btn.classList.add('active');
                    }
                });
                
                // 显示已退票列表
                showTripsList('refunded');
            }

            // 在页面加载时处理重定向
            if (localStorage.getItem('redirectAfterRefund') === 'true') {
                // 清除重定向标记
                localStorage.removeItem('redirectAfterRefund');
                
                // 确保所有页面元素都已加载
                setTimeout(() => {
                    // 正确显示行程页面
                    showPage('tripsPage');
                    
                    // 更新筛选器状态
                    document.querySelectorAll('.filter-btn').forEach(btn => {
                        btn.classList.remove('active');
                        if (btn.dataset.filter === 'refunded') {
                            btn.classList.add('active');
                        }
                    });
                    
                    // 显示已退票列表
                    showTripsList('refunded');
                }, 100);
            }

            // 添加深色模式控制逻辑
            const toggleSwitch = document.querySelector('.toggle-switch');
            
            // 检查系统颜色方案
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
            
            // 从本地存储获取用户设置
            const savedTheme = localStorage.getItem('theme');
            
            // 添加节日特效控制
            function toggleFestiveEffects() {
                const toggle = document.getElementById('festiveEffectsToggle');
                const currentState = localStorage.getItem('festiveEffects') === 'enabled';
                const newState = !currentState;
                
                // 更新开关状态
                localStorage.setItem('festiveEffects', newState ? 'enabled' : 'disabled');
                toggle.classList.toggle('active', newState);
                
                // 更新特效状态
                const styleSheet = document.getElementById('festiveStyles');
                if (styleSheet) {
                    styleSheet.disabled = !newState;
                }

                // 控制灯笼元素的显示
                const dengBox = document.querySelector('.deng-box1');
                if (dengBox) {
                    dengBox.style.display = newState ? 'block' : 'none';
                }
            }

            // 页面加载时初始化节日特效状态
            document.addEventListener('DOMContentLoaded', () => {
                const toggle = document.getElementById('festiveEffectsToggle');
                const currentState = localStorage.getItem('festiveEffects') === 'enabled';
                
                // 设置开关初始状态
                toggle.classList.toggle('active', currentState);
                
                // 设置特效初始状态
                const styleSheet = document.getElementById('festiveStyles');
                if (styleSheet) {
                    styleSheet.disabled = !currentState;
                }

                // 设置灯笼元素初始状态
                const dengBox = document.querySelector('.deng-box1');
                if (dengBox) {
                    dengBox.style.display = currentState ? 'block' : 'none';
                }
            });
        });

        // 处理返回按钮
        function handleBack() {
            // 获取当前页面
            const currentPage = document.querySelector('.main-content > div[style*="display: block"]').id;
            
            if (currentPage === 'homePage') {
                // 如果在首页，显示退出确认
                showModal('确定要退出吗？', {
                    content: '退出后需要重新打开应用',
                    showCancel: true,
                    cancelText: '取消',
                    confirmText: '退出',
                    type: 'danger'
                }).then(result => {
                    if (result) {
                        window.close();
                    }
                });
            } else {
                // 其他页面返回首页
                showHomePage();
            }
        }

        // 更新页面标题
        function updatePageTitle(pageName) {
            const pageTitle = document.querySelector('.page-title');
            document.body.classList.toggle('at-home', pageName === 'homePage');
            
            switch(pageName) {
                case 'homePage':
                    pageTitle.textContent = '临途出行';
                    break;
                case 'ticketPage':
                    const routeInfo = JSON.parse(sessionStorage.getItem('currentRoute'));
                    if (routeInfo) {
                        pageTitle.textContent = `${routeInfo.departure}-${routeInfo.arrival}`;
                    }
                    break;
                case 'paymentPage':
                    pageTitle.textContent = '确认支付';
                    break;
                case 'tripsPage':
                    pageTitle.textContent = '行程';
                    break;
                case 'profilePage':
                    pageTitle.textContent = '我的';
                    break;
            }
        }

        // 更新底部导航状态
        function updateBottomNav(pageName) {
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.page === pageName);
            });
        }

        // 显示票务页面
        function showTicketPage(departure, arrival, routes) {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('ticketPage').style.display = 'block';
            document.body.classList.remove('at-home');
            document.querySelector('.page-title').textContent = `${departure}-${arrival}`;
            pageHistory.push('ticketPage');
            
            const datePicker = document.getElementById('datePicker');
            datePicker.innerHTML = '';
            
            let selectedDateIndex = 0;
            
            for (let i = 0; i < 6; i++) {
                const date = new Date();
                date.setDate(date.getDate() + i);
                const dateItem = document.createElement('div');
                dateItem.className = `date-item ${i === 0 ? 'active' : ''}`;
                dateItem.textContent = `${date.getMonth() + 1}月${date.getDate()}日`;
                dateItem.dataset.date = date.toISOString().split('T')[0];
                dateItem.dataset.index = i;
                
                dateItem.addEventListener('click', (e) => {
                    document.querySelectorAll('.date-item').forEach(item => {
                        item.classList.remove('active');
                    });
                    e.target.classList.add('active');
                    selectedDateIndex = parseInt(e.target.dataset.index);
                    updateRouteList(routes, selectedDateIndex);
                });
                
                datePicker.appendChild(dateItem);
            }
            
            updateRouteList(routes, selectedDateIndex);
        }

        // 更新路线列表
        function updateRouteList(routes, dateIndex) {
            const routeList = document.getElementById('routeList');
            routeList.innerHTML = '';
            
            const selectedDate = new Date();
            selectedDate.setDate(selectedDate.getDate() + dateIndex);
            const isToday = dateIndex === 0;
            
            let availableRoutes = 0;

            // 对路线按发车时间排序
            routes.sort((a, b) => {
                const [aHours, aMinutes] = a.time.split(':').map(Number);
                const [bHours, bMinutes] = b.time.split(':').map(Number);
                // 转换为分钟进行比较
                return (aHours * 60 + aMinutes) - (bHours * 60 + bMinutes);
            });

            routes.forEach(route => {
                if (isToday) {
                    const now = new Date();
                    const [hours, minutes] = route.time.split(':');
                    const departureTime = new Date();
                    departureTime.setHours(parseInt(hours), parseInt(minutes), 0);
                    
                    if (now > departureTime) {
                        return;
                    }
                }
                
                availableRoutes++;

                const card = document.createElement('div');
                card.className = 'route-card';
                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fs-5">${route.time}</div>
                            <div class="text-muted">班次 ${route.id}</div>
                            <div class="text-muted">线路 ${route.line}</div>
                            <div class="text-muted">区间 ${route.departure} - ${route.arrival}</div>
                            <div class="text-muted">公司 ${route.company || '临东公交'}</div>
                        </div>
                        <div>
                            <div class="fs-5">¥${route.price}</div>
                            <button class="btn btn-sm btn-outline-primary ripple">购票</button>
                        </div>
                    </div>
                `;
                
                card.querySelector('button').addEventListener('click', () => {
                    const selectedDateStr = document.querySelector('.date-item.active').dataset.date;
                    showPaymentPage(route, selectedDateStr);
                });
                
                routeList.appendChild(card);
            });

            if (availableRoutes === 0) {
                const emptyState = document.createElement('div');
                emptyState.className = 'empty-state';
                emptyState.innerHTML = `
                    <div class="empty-state-content">
                        <span class="empty-state-icon">&#x1F3AB;</span>
                        <p>该日已无班次，请选择其他日期</p>
                    </div>
                `;
                routeList.appendChild(emptyState);
            }
        }

        // 显示支付页面
        function showPaymentPage(route, selectedDate) {
            // 检查是否为仅线下售票
            if (route.price === 0) {
                showModal('此线路只能在线下购票！',
                {
                    content: '线路：'+route.line+'\n公司：'+route.company+'\n购票方式：车上售票',
                    showCancel: false,
                    confirmText: '关闭'
                });
                return;
            }

            // 检查是否已购买相同车票
            const hasExistingTicket = orders.some(order => {
                // 确保订单和路线信息完整
                if (!order || !order.route || !order.status) return false;
                
                // 只检查未退票的订单
                if (order.status === 'refunded') return false;
                
                // 检查日期是否相同
                const isSameDate = order.date === selectedDate;
                
                // 检查发车时间是否相同
                const isSameTime = order.route.time === route.time;
                
                // 检查线路是否相同
                const isSameLine = order.route.line === route.line;
                
                return isSameDate && isSameTime && isSameLine;
            });

            if (hasExistingTicket) {
                showModal('您已购买过该车次的车票！');
                return;
            }

            document.getElementById('ticketPage').style.display = 'none';
            document.getElementById('paymentPage').style.display = 'block';
            pageHistory.push('paymentPage');
            document.body.classList.remove('at-home');
            document.querySelector('.page-title').textContent = '确认支付';

            const orderDate = new Date(selectedDate);
            const dateStr = `${orderDate.getMonth() + 1}月${orderDate.getDate()}日`;

            document.getElementById('orderInfo').innerHTML = `
                <div class="mb-3">
                    <div class="text-muted">班次</div>
                    <div>${route.id}</div>
                </div>
                <div class="mb-3">
                    <div class="text-muted">始发站发车时间</div>
                    <div>${dateStr} ${route.time}</div>
                </div>
                <div class="mb-3">
                    <div class="text-muted">线路</div>
                    <div>${route.line}</div>
                </div>
                <div class="mb-3">
                    <div class="text-muted">乘车区间</div>
                    <div>${route.departure} - ${route.arrival}</div>
                </div>
                <div class="mb-3">
                    <div class="text-muted">运营公司</div>
                    <div>${route.company}</div>
                </div>
                <div class="mb-3">
                    <div class="text-muted">票价</div>
                    <div class="fs-4">¥${route.price}</div>
                </div>
            `;

            document.getElementById('moreInfoBtn').href = route.link;

            document.getElementById('payBtn').onclick = async () => {
                await saveOrder(route, selectedDate);
                await showModal('支付成功！');
                showTripsPage();
            };
        }

        // 在支付成功后保存订单
        async function saveOrder(route, selectedDate) {
            const order = {
                id: generateOrderId(),
                route: route,
                date: selectedDate,
                status: 'upcoming',
                qrCode: generateBarCode(route.id)
            };
            orders.unshift(order);
            localStorage.setItem('orders', JSON.stringify(orders));
        }

        // 生成订单ID
        function generateOrderId() {
            return 'ORDER' + Date.now().toString(36).toUpperCase();
        }

        // 生成条码数据
        function generateBarCode(routeId) {
            const date = new Date();
            const dateStr = date.getFullYear().toString().slice(-2) +
                           String(date.getMonth() + 1).padStart(2, '0') +
                           String(date.getDate()).padStart(2, '0');
            const random = Math.random().toString().slice(-4).padStart(4, '0');
            // 生成16位编码
            return `${routeId}${dateStr}${random}`.padEnd(16, '0').slice(0, 16);
        }

        // 更新显示行程列表的函数
        function showTripsList(filter) {
            if (!filter) filter = 'upcoming';
            
            var tripsList = document.getElementById('tripsList');
            tripsList.innerHTML = '';
            
            // 获取当前时间
            var now = new Date();
            
            // 更新过滤逻辑
            var filteredOrders = orders.filter(function(order) {
                if (!order || !order.route || !order.date) return false;
                
                var orderDate = new Date(order.date);
                var timeParts = order.route.time.split(':');
                var departureTime = new Date(orderDate);
                departureTime.setHours(parseInt(timeParts[0]), parseInt(timeParts[1]));
                
                switch(filter) {
                    case 'upcoming':
                        // 只显示未退票且未出行的订单
                        return order.status === 'upcoming' && departureTime >= now;
                    case 'completed':
                        // 只显示未退票且已出行的订单
                        return order.status === 'upcoming' && departureTime < now;
                    case 'refunded':
                        // 显示所有已退票的订单
                        return order.status === 'refunded';
                    default:
                        return true;
                }
            });

            // 按日期排序
            filteredOrders.sort(function(a, b) {
                return new Date(b.date) - new Date(a.date);
            });

            // 显示空状态或订单列表
            if (filteredOrders.length === 0) {
                var emptyText = filter === 'upcoming' ? '未出行' : 
                               filter === 'completed' ? '已完成' : '已退票';
                tripsList.innerHTML = '<div class="empty-state">' +
                    '<div class="empty-state-content">' +
                    '<div class="empty-state-icon">&#x1F3AB;</div>' + // 使用 HTML 实体代替 emoji
                    '<p>暂无' + emptyText + '订单</p>' +
                    '</div></div>';
            } else {
                filteredOrders.forEach(function(order) {
                    if (!order || !order.route) return;
                    
                    var orderDate = new Date(order.date);
                    var dateStr = (orderDate.getMonth() + 1) + '月' + orderDate.getDate() + '日';
                    
                    var card = document.createElement('div');
                    card.className = 'route-card';
                    
                    // 创建一个安全的订单字符串，使用encodeURIComponent确保编码正确
                    var safeOrderStr = encodeURIComponent(JSON.stringify(order));
                    
                    // 使用 textContent 设置文本内容，避免 innerHTML 的编码问题
                    var cardContent = document.createElement('div');
                    cardContent.className = 'd-flex justify-content-between align-items-center mb-3';
                    
                    var infoDiv = document.createElement('div');
                    
                    var routeDiv = document.createElement('div');
                    routeDiv.className = 'fs-5';
                    routeDiv.textContent = order.route.departure + ' - ' + order.route.arrival;
                    infoDiv.appendChild(routeDiv);
                    
                    var idDiv = document.createElement('div');
                    idDiv.className = 'text-muted';
                    idDiv.textContent = '班次 ' + order.route.id;
                    infoDiv.appendChild(idDiv);
                    
                    var timeDiv = document.createElement('div');
                    timeDiv.className = 'text-muted';
                    timeDiv.textContent = dateStr + ' ' + order.route.time;
                    infoDiv.appendChild(timeDiv);
                    
                    var lineDiv = document.createElement('div');
                    lineDiv.className = 'text-muted';
                    lineDiv.textContent = order.route.line;
                    infoDiv.appendChild(lineDiv);
                    
                    var companyDiv = document.createElement('div');
                    companyDiv.className = 'text-muted';
                    companyDiv.textContent = order.route.company;
                    infoDiv.appendChild(companyDiv);
                    
                    cardContent.appendChild(infoDiv);
                    
                    var button = document.createElement('button');
                    button.className = 'btn btn-outline-primary';
                    button.textContent = '详情';
                    button.setAttribute('data-order', safeOrderStr);
                    
                    cardContent.appendChild(button);
                    card.appendChild(cardContent);
                    
                    // 使用事件监听器而不是内联onclick
                    button.addEventListener('click', function() {
                        var orderData = JSON.parse(decodeURIComponent(safeOrderStr));
                        showOrderDetail(orderData);
                    });
                    
                    tripsList.appendChild(card);
                });
            }

            // 添加清除历史记录按钮（仅在已完成和已退票页面）
            if ((filter === 'completed' || filter === 'refunded') && filteredOrders.length > 0) {
                var clearButton = document.createElement('button');
                clearButton.className = 'clear-history-btn';
                clearButton.textContent = '清除历史记录';
                clearButton.onclick = function() {
                    showModal('确定要清除所有历史记录吗？', {
                        content:'清除后，将无法找回行程信息',
                        showCancel: true,
                        cancelText: '取消',
                        confirmText: '清除',
                        type: 'danger'  
                    }).then(function(confirmed) {
                        if (confirmed) {
                            // 清除对应类型的历史记录
                            orders = orders.filter(function(order) {
                                var orderDate = new Date(order.date);
                                var timeParts = order.route.time.split(':');
                                var departureTime = new Date(orderDate);
                                departureTime.setHours(parseInt(timeParts[0]), parseInt(timeParts[1]));
                                var now = new Date();
                                
                                if (filter === 'completed') {
                                    // 只清除已完成（过期）且未退票的订单
                                    return !(departureTime < now && order.status !== 'refunded');
                                } else if (filter === 'refunded') {
                                    // 只清除已退票的订单
                                    return order.status !== 'refunded';
                                }
                                return true;
                            });
                            
                            // 更新本地存储
                            localStorage.setItem('orders', JSON.stringify(orders));
                            
                            // 刷新显示
                            showTripsList(filter);
                            
                            // 显示清除成功提示
                            showModal('历史记录已清除');
                        }
                    });
                };
                tripsList.appendChild(clearButton);
            }
        }

        // 显示订单详情

                barcodeContainer.innerHTML = `

                `;

                updateBarcode(order);

            }

            // 更新退票按钮逻辑
            const refundBtnContainer = document.getElementById('refundBtnContainer');

            const departureTime = new Date(order.date);
            const [hours, minutes] = order.route.time.split(':');
            departureTime.setHours(parseInt(hours), parseInt(minutes) - 15);

            if (now < departureTime && order.status === 'upcoming') {
                refundBtnContainer.innerHTML = `
                    <button class="refund-btn">退票</button>
                `;
                refundBtnContainer.querySelector('.refund-btn').onclick = async () => {

                    if (confirmed) {

                        const orderIndex = orders.findIndex(o =>

                        );

                        }
                    }
                };

                refundBtnContainer.innerHTML = '';

        // 更新条形码显示
        function updateBarcode(order) {
            // 清空之前的条形码
            const barcodeElement = document.getElementById('barcode');
            while (barcodeElement.firstChild) {
                barcodeElement.removeChild(barcodeElement.firstChild);
            }

            try {
                JsBarcode("#barcode", order.qrCode, {
                    format: "CODE128",
                    width: 2,             // 设置每个条的宽度
                    height: 100,          // 设置条形码高度
                    displayValue: true,   // 显示编码内容
                    fontSize: 16,         // 字体大小
                    margin: 20,           // 外边距
                    background: "#ffffff",
                    lineColor: "#000000",
                    font: "monospace",
                    textMargin: 8,        // 文本和条码之间的距离
                    textAlign: "center"
                });
                
                // 获取生成的SVG元素并调整其viewBox
                const svg = document.getElementById('barcode');
                const viewBoxWidth = parseInt(svg.getAttribute('width'));
                const viewBoxHeight = parseInt(svg.getAttribute('height'));
                
                // 设置SVG的viewBox以确保完整显示
                svg.setAttribute('viewBox', `0 0 ${viewBoxWidth} ${viewBoxHeight}`);
                svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                
                // 显示条形码容器
                document.querySelector('.barcode-container').style.display = 'block';
                
                // 绑定刷新按钮事件
                document.getElementById('refreshBarcodeBtn').onclick = () => {
                    order.qrCode = generateBarCode(order.route.id);
                    localStorage.setItem('orders', JSON.stringify(orders));
                    updateBarcode(order);
                };

            } catch (error) {
                const qrCodeLink = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + order.id
                console.error('Error generating barcode:', error);
                console.log(qrCodeLink);
                document.querySelector('.barcode-container').innerHTML = `

                    <div class="text-danger">开车前15分钟及开车后不可退票</div>

                    <div class="text-danger"><a href="${qrCodeLink}" target="_blank">查看乘车码</a></div>
                `;
            }
        }

        async function loadNotices() {
            try {
                const response = await fetch('notice.txt');
                if (!response.ok) {
                    console.error('Failed to load notices:', response.status);
                    return [];
                }
                const text = await response.text();
                const lines = text.split('\n');
                const notices = [];
                let currentNotice = {};

                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    if (trimmedLine.startsWith('[标题]')) {
                        if (Object.keys(currentNotice).length > 0) {
                            notices.push(currentNotice);
                        }
                        currentNotice = {
                            title: trimmedLine.split('] ')[1].trim()
                        };
                    } else if (trimmedLine.startsWith('[内容]')) {
                        currentNotice.content = trimmedLine.split('] ')[1].trim();
                    } else if (trimmedLine.startsWith('[链接]')) {
                        currentNotice.link = trimmedLine.split('] ')[1].trim();
                    }
                });
                
                if (Object.keys(currentNotice).length > 0) {
                    notices.push(currentNotice);
                }

                return notices.slice(0, 3);
            } catch (error) {
                console.error('Error loading notices:', error);
                return [];
            }
        }

        // 轮播功能
        class Carousel {
            constructor(element) {
                this.element = element;
                this.items = element.querySelectorAll('.carousel-item');
                this.indicators = element.querySelectorAll('.carousel-indicators button');
                this.currentIndex = 0;
                this.interval = null;
                
                this.initCarousel();
            }

            initCarousel() {
                // 设置指示器点击事件
                this.indicators.forEach((indicator, index) => {
                    indicator.addEventListener('click', () => this.goToSlide(index));
                });

                // 开始自动轮播
                this.startAutoSlide();
            }

            goToSlide(index) {
                // 移除当前活动项的 active 类
                this.items[this.currentIndex].classList.remove('active');
                this.indicators[this.currentIndex].classList.remove('active');

                // 更新当前索引
                this.currentIndex = index;

                // 添加新活动项的 active 类
                this.items[this.currentIndex].classList.add('active');
                this.indicators[this.currentIndex].classList.add('active');
            }

            startAutoSlide() {
                this.interval = setInterval(() => {
                    let nextIndex = (this.currentIndex + 1) % this.items.length;
                    this.goToSlide(nextIndex);
                }, 5000);
            }

            stopAutoSlide() {
                if (this.interval) {
                    clearInterval(this.interval);
                }
            }
        }

        async function loadAndShowAlertBar() {
            try {
                const response = await fetch('bar.txt');
                if (!response.ok) return;
                
                const text = await response.text();
                if (!text.trim()) return;
                
                const lines = text.split('\n');
                const alertData = {};
                
                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    if (trimmedLine.startsWith('[标题]')) {
                        alertData.title = trimmedLine.split('] ')[1].trim();
                    } else if (trimmedLine.startsWith('[内容]')) {
                        alertData.content = trimmedLine.split('] ')[1].trim();
                    } else if (trimmedLine.startsWith('[链接]')) {
                        alertData.link = trimmedLine.split('] ')[1].trim();
                    }
                });
                
                if (!alertData.title && !alertData.content) return;
                
                const alertBar = document.createElement('div');
                alertBar.className = 'alert-bar';
                alertBar.innerHTML = `
                    <div class="alert-bar-content">
                        ${alertData.title ? `<div class="alert-bar-title">${alertData.title}</div>` : ''}
                        ${alertData.content ? `<div class="alert-bar-text">${alertData.content}</div>` : ''}
                    </div>
                    <div class="alert-bar-actions">
                        ${alertData.link ? `<a href="${alertData.link}" class="alert-bar-link" target="_blank">查看详情</a>` : ''}
                        <button class="alert-bar-close">&times;</button>
                    </div>
                `;
                
                document.body.appendChild(alertBar);
                
                // 调整主内容区域的上边距
                document.querySelector('.main-content').style.marginTop = '110px';
                
                // 绑定关闭按钮事件
                alertBar.querySelector('.alert-bar-close').addEventListener('click', () => {
                    alertBar.remove();
                    document.querySelector('.main-content').style.marginTop = '60px';
                });
                
            } catch (error) {
                showNoAlert();//展示没有公告的提示

        // Dark mode toggle function

            // 切换开关状态

            // 根据开关状态设置深色模式

            document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');

        // 页面加载时初始化深色模式
        document.addEventListener('DOMContentLoaded', () => {
            const darkModeToggle = document.getElementById('darkModeToggle');
            const darkModeItem = document.querySelector('.profile-item[data-feature="darkMode"]');
            const toggleSwitch = document.querySelector('.toggle-switch');
            
            if (darkModeItem && darkModeToggle && toggleSwitch) {
                // 为整个 profile-item 添加点击事件
                darkModeItem.addEventListener('click', (e) => {
                    // 如果点击的是开关本身，不处理
                    if (e.target.closest('.toggle-switch')) {
                        return;
                    }
                    toggleDarkMode();
                });
                
                // 为开关添加点击事件
                toggleSwitch.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleDarkMode();
                });

                // 设置初始状态
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const savedTheme = localStorage.getItem('theme');
                const shouldBeDark = savedTheme === 'dark' || 
                                    (savedTheme === null && prefersDark);
                
                // 同步更新初始状态
                darkModeToggle.classList.toggle('active', shouldBeDark);
                document.documentElement.setAttribute('data-theme', shouldBeDark ? 'dark' : 'light');
                
                // 监听系统主题变化
                window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
                    if (!localStorage.getItem('theme')) {
                        const newState = e.matches;
                        darkModeToggle.classList.toggle('active', newState);
                        document.documentElement.setAttribute('data-theme', newState ? 'dark' : 'light');
                    }
                });
            }
        });
