<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨城通</title>
    <link rel="icon" href="/UI/res/雨城通logo绿.png" type="image/png">
    <link rel="stylesheet" href="mainpage.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            height: 60vh;
        }
        .error-container img {
            opacity: 0.4;
            filter: hue-rotate(180deg);
        }
        
        @media (prefers-color-scheme: dark) {
            .error-container img {
                opacity: 0.6;
                filter: hue-rotate(180deg) brightness(0.8) invert(1);
            }
        }
        
        @media (max-width: 640px) {
            .error-container {
                flex-direction: column;
                text-align: center;
            }
            .error-container h1 {
                display: none;
            }
            .error-container h2 {
                display: block;
            }
        }
        @media (min-width: 640px) {
            .error-container h2 {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- 头部导航栏 -->
    <header>
        <div class="logo">
            <img src="/UI/res/雨城通logo带文字浅色.png" alt="雨城通">
        </div>
    </header>

    <!-- 主要内容区 -->
    <main>
        <div class="error-container">
            <img src="404.png" alt="404">
            <div class="text">
                <h1>您访问的页面不存在</h1>
                <h2>您访问的页面不存在</h2>
                <p>请检查网址是否正确。如果页面没有跳转，请<a href="/">点击返回</a></p>            
            </div>
        </div>
    </main>
<script>
    window.onload = function() {
        setTimeout(function() {
            window.location.href = '/';
        }, 3000);
    }
</script>
</body>
</html>
