<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图搜索 - 雨城通实验室</title>
    <link rel="icon" href="/UI/res/雨城通logo绿.png" type="image/png">
    <link rel="stylesheet" href="/data_composer/style.css" />
    <link rel="stylesheet" href="/lab/style.css" />
    <link rel="stylesheet" href="/UI/toast.css" />
    <link rel="stylesheet" href="/mainpage.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<!-- 头部导航栏 -->
<header class="header">
    <button class="icon-button" id="back-to-home" onclick="window.location.href='/'" title="雨城通首页">
        <img src="/UI/res/雨城通logo绿.png" alt="雨城通首页">
    </button>
    <h1>地图搜索</h1>
    <div class="toolbar">
        <button class="fab icon-button">
            <img src="/UI/res/map_preview_white.png" alt="高清卫星图">
            <span>高清卫星图</span>
        </button>
        <button class="icon-button" id="image-btn" onclick="" title="存为图片">
            <img src="/UI/res/image_black.png" alt="存为图片">
        </button>
        <button class="icon-button" id="list-btn" onclick="" title="本地标记点">
            <img src="/UI/res/question_black.png" alt="本地标记点">
        </button>
        <!-- <button class="icon-button" id="favorite-btn" onclick="" title="收藏夹">
            <img src="/UI/res/favorite_outline_black.png" alt="收藏夹">
        </button> -->
        <button class="icon-button" id="share-btn" onclick="" title="复制链接">
            <img src="/UI/res/link_black.png" alt="复制链接">
        </button>
    </div>
</header>

<body>
    <!-- 主要内容区 -->
    <div class="content-container">
        <div class="preview-container">
            <div class="tile-container"></div>
            <div class="map-scale" style="color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.5);">
                <div class="scale-bar" style="border-bottom: 2px solid #fff; border-left: 1px solid #fff; border-right: 1px solid #fff;"></div>
                <div class="scale-text" style="color: #fff;">200格</div>
            </div>
            <div class="zoom-controls">
                <button class="icon-button zoom-button" id="zoom-in">
                    <img src="/UI/res/plus_black.png" alt="放大">
                </button>
                <button class="icon-button zoom-button" id="zoom-out">
                    <img src="/UI/res/minus_black.png" alt="缩小">
                </button>
            </div>
            <div class="pin-container">
                <img src="/UI/res/map_pin.png" alt="Pin" class="pin">
                <div class="pin-label">当前位置</div>
            </div>
            <div class="preview-footer" style="color: #eee; text-shadow: 0 2px 2px rgba(0, 0, 0, 0.2);">
                <img src="/UI/res/雨城通logo带文字浅色.png" alt="logo" class="site-logo">
                <p style="color: #eee;">图片可能无法反映最新情况</p>
                <p style="color: #eee;">上述地名纯属虚构</p>
            </div>
        </div>
        <div class="search-container">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="请输入搜索内容"></input>
            </div>
            <!-- 在页面适当位置添加 -->
            <div class="coordinates">
                <input type="number" id="coordinates-x" placeholder="请输入坐标">
                <input type="number" id="coordinates-z" placeholder="请输入坐标">
                <select id="category-filter">
                    <option value="">全部分类</option>
                </select>
            </div>
            <div class="caption shorcut-container" style="display: flex;flex-direction: row;flex-wrap: wrap;align-items: center;padding: 0;">
                <div class="move-container" style="display: inline-flex; flex-direction: column; align-items: center;">
                    <div class="shortcut-key" style="margin-left: 0;">W</div>
                    <div style="display: flex; flex-direction: row; align-items: center;">
                        <div class="shortcut-key" style="margin-left: 0;">A</div>
                        <div class="shortcut-key" style="margin-left: 0;">S</div>
                        <div class="shortcut-key" style="margin-left: 0;">D</div>
                    </div>
                </div>
                移动±10
                <div class="shortcut-key" style="display: inline-flex;">Alt</div>
                ±1<div class="shortcut-key" style="display: inline-flex;">Shift</div>
                ±100，
                <div>
                    <div class="shortcut-key" style="margin-left: 0;">-</div>
                    <div class="shortcut-key" style="margin-left: 0;">=</div>
                    <span>或滚轮缩放</span>
                </div>
            </div>
            <div class="caption no-results">
                此处未被标记，可浏览以下周边标记点或<div class="add-new-point">申请新标记</div>
            </div>
            <div class="search-result">
                <!-- 数据项将在这里动态添加 -->
            </div>
        </div>
    </div>
    <div class="modal-container" id="add-point-modal">
        <div class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">新标记申请</h3>
                    <button class="icon-button" id="close-modal">
                        <img src="/UI/res/close_black.png" alt="关闭">
                    </button>
                </div>
                <input type="text" id="point-name" placeholder="标记点名称，可用竖线符号|断行"></input>
                <select type="select" id="point-category">
                    <!-- 分类项将在这里动态添加 -->
                </select>
                <div class="modal-footer">
                    <button id="save-point">暂存标记</button>
                    <button id="copy-point-code">复制代码</button>
                    <button class="action-button" style="padding: 5px 16px;" id="send-via-email">发送邮件</button>
                </div>
            </div>
        </div>
    </div>
    <!-- 管理本地标记点的模态框 -->
    <div class="modal-container" id="manage-points-modal">
        <div class="modal" style="width: 95%;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">暂存的标记</h3>
                    <button class="icon-button" id="close-manage-modal">
                        <img src="/UI/res/close_black.png" alt="关闭">
                    </button>
                </div>
                <div class="manage-points-content">
                    <div class="manage-points-toolbar">
                        <button id="toggle-all-points">全选</button>
                        <div class="manage-points-actions">
                            <button id="delete-selected-points" style="color: crimson;">删除</button>
                            <button id="copy-selected-points" style="color: seagreen;">复制代码</button>
                            <button id="send-selected-points" class="action-button">发送邮件</button>
                        </div>
                    </div>
                    <div class="manage-points-list">
                        <!-- 本地标记点将在这里动态添加 -->
                    </div>
                </div>
                <div class="caption" style="padding: 0;">
                    <p>本地标记点仅在当前设备上可见，同一位置的标记点被采纳后将自动清除</p>
                </div>
            </div>
        </div>
    </div>
    <!-- 编辑标记点的模态框 -->
    <div class="modal-container" id="edit-point-modal">
        <div class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">编辑标记点</h3>
                    <button class="icon-button" id="close-edit-modal">
                        <img src="/UI/res/close_black.png" alt="关闭">
                    </button>
                </div>
                <input type="hidden" id="edit-point-index">
                <input type="text" id="edit-point-name" placeholder="标记点名称，可用竖线符号|断行"></input>
                <select type="select" id="edit-point-category">
                    <!-- 分类项将在这里动态添加 -->
                </select>
                <div class="modal-footer">
                    <button id="cancel-edit-point">取消</button>
                    <button class="action-button" id="save-edit-point">保存更改</button>
                </div>
            </div>
        </div>
    </div>
</body>

<div class="toast-overlay">
</div>
<div class="caption-section" style="width: 100%; gap: 0; max-width: 1024px;">
</div>

<script type="module" src="script.js"></script>
<script type="module" src="navigation.js"></script>
<!-- 引入其他必要的脚本文件 -->
<script src="/UI/toast.js"></script>
<script type="module" src="/UI/footer.js"></script>
<script type="module" src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</html>
