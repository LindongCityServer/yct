<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图搜索 - 雨城通实验室</title>
    <link rel="icon" href="/UI/res/雨城通logo绿.png" type="image/png">
    <link rel="stylesheet" href="/mainpage.css" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/data_composer/style.css" />
    <link rel="stylesheet" href="/lab/style.css" />
    <link rel="stylesheet" href="road_sign.css" />
    <link rel="stylesheet" href="/UI/toast.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<!-- 头部导航栏 -->
<header class="header">
    <button class="icon-button" id="back-to-lab" onclick="window.location.href='/lab'" title="实验室">
        <img src="/UI/res/arrow_back_black.png" alt="返回">
    </button>
    <h1>地图搜索</h1>
    <div class="toolbar">            
        <button class="icon-button" id="share-btn" onclick="" title="复制链接">
            <img src="/UI/res/link_black.png" alt="复制链接">
        </button>
    </div>
</header>

<body>
    <!-- 主要内容区 -->
    <div class="content-container">
        <div class="preview-container">
            <div class="tile-container"></div>
            <div class="map-scale">
                <div class="scale-bar"></div>
                <div class="scale-text">200格</div>
            </div>
            <div class="pin-container">
                <img src="/UI/res/map_pin.png" alt="Pin" class="pin">
                <div class="pin-label">当前位置</div>
            </div>
            <div class="preview-footer">
                <img src="/UI/res/雨城通logo带文字浅色.png" alt="logo" class="site-logo">
                <p>图片可能无法反映最新情况</p>
                <p>上述地名纯属虚构</p>
            </div>
        </div>
        <div class="search-container">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="请输入搜索内容"></input>
            </div>
            <!-- 在页面适当位置添加 -->
            <div class="coordinates">
                <input type="number" id="coordinates-x" placeholder="请输入坐标">
                <input type="number" id="coordinates-z" placeholder="请输入坐标">
                <select id="category-filter">
                    <option value="">全部分类</option>
                </select>
            </div>
            <div class="caption shorcut-container" style="display: inline-flex;flex-direction: row;align-items: center;padding: 0;">
                <div class="move-container" style="display: inline-flex; flex-direction: column; align-items: center;">
                    <div class="shortcut-key" style="margin-left: 0;">W</div>
                    <div style="display: flex; flex-direction: row; align-items: center;">
                        <div class="shortcut-key" style="margin-left: 0;">A</div>
                        <div class="shortcut-key" style="margin-left: 0;">S</div>
                        <div class="shortcut-key" style="margin-left: 0;">D</div>
                    </div>
                </div>
                移动±10
                <div class="shortcut-key" style="display: inline-flex;">Alt</div>
                ±1<div class="shortcut-key" style="display: inline-flex;">Shift</div>
                ±100，
                <div style="display: inline;">点击地图区域存为图片</div>
            </div>
            <div class="caption no-results">
                此处未被标记，可浏览以下周边标记点或<div class="add-new-point">添加新标记</div>
            </div>
            <div class="search-result">
                <!-- 数据项将在这里动态添加 -->
            </div>
        </div>
    </div>
    <div class="modal-container" id="add-point-modal">
        <div class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">添加新标记</h3>
                    <button class="icon-button" id="close-modal">
                        <img src="/UI/res/close_black.png" alt="关闭">
                    </button>
                </div>
                <input type="text" id="point-name" placeholder="标记点名称"></input>
                <select type="select" id="point-category">
                    <!-- 分类项将在这里动态添加 -->
                </select>
                <div class="modal-footer">
                    <button id="copy-point-code" style="color:black">复制代码</button>
                    <button class="action-button" style="padding: 5px 16px;" id="send-via-email">发送邮件</button>
                </div>
            </div>
        </div>
    </div>
</body>

<div class="toast-overlay">
</div>
<div class="caption-section" style="width: 100%; gap: 0; max-width: 1024px;">
</div>

<script type="module" src="script.js"></script>
<!-- 引入其他必要的脚本文件 -->
<script src="/UI/toast.js"></script>
<script type="module" src="/UI/footer.js"></script>
<script type="module" src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</html>
