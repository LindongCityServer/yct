<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公交线路图</title>
    <link rel="icon" href="../UI/res/雨城通logo绿.png" type="image/png">
    <link rel="stylesheet" href="../mainpage.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../UI/toast.css">
</head>


<body>
    <!-- 头部导航栏 -->
    <header class="header">
        <button class="icon-button" id="back-to-home" onclick="window.location.href='../'" title="雨城通首页">
            <img src="../UI/res/雨城通logo绿.png" alt="雨城通首页">
        </button>
        <h1>公交线路图</h1>
        <div class="toolbar route-toolbar">
            <button class="icon-button" id="toggle-transfer-panel" title="隐藏换乘面板">
                <img src="../UI/res/route_black.png" alt="换乘查询">
            </button>
            <button class="icon-button" id="search-button" title="搜索">
                <img src="../UI/res/search_black.png" alt="搜索">
            </button>
        </div>
    </header>

    <!-- 主要内容区 -->
    <main>
        <!-- 左侧换乘查询区域 -->
        <div class="transfer-section">
            <div class="transfer-inputs">
                <div class="transfer-input-group">
                    <label>起点站</label>
                    <input type="text" id="start-station" placeholder="输入起点站">
                </div>
                <div class="transfer-input-group">
                    <label>终点站</label>
                    <input type="text" id="end-station" placeholder="输入终点站">
                </div>
            </div>
            <div class="transfer-buttons">
                <button class="transfer-button" id="search-transfer">查找路线</button>
                <button class="transfer-button secondary" id="clear-transfer">清空</button>
            </div>
            <div class="transfer-results"></div>
            <section class="caption-section desktop-caption" style="margin-top:12px;padding:0"></section>
        </div>

        <!-- 右侧线路展示区域 -->
        <div class="route-section"></div>
        <section class="caption-section mobile-caption"></section>
    </main>

    <!-- 站点详情弹窗 -->
    <div class="station-detail-modal">
        <div class="modal-header">
            <h3></h3>
            <button class="close-modal">
                <img src="../UI/res/close_black.png" alt="关闭">
            </button>
        </div>
        <div class="route-list">
            <!-- 路线列表将通过JavaScript动态添加 -->
        </div>
    </div>

    <!-- 遮罩层 -->
    <div class="modal-overlay"></div>

    <!-- 添加行程提醒对话框 -->
    <div id="add-trip-dialog" class="dialog" style="display: none;">
        <div class="dialog-content">
            <h3>添加行程提醒</h3>
            <div class="dialog-body">
                <div class="time-info">
                    <p class="estimated-time"></p>
                    <p class="estimated-arrival"></p>
                </div>
                <div class="time-type-selector">
                    <label>
                        <input type="radio" name="timeType" value="departure" checked> 出发时间
                    </label>
                    <label>
                        <input type="radio" name="timeType" value="arrival"> 到达时间
                    </label>
                </div>
                <div class="time-input">
                    <label>选择时间：</label>
                    <input type="datetime-local" id="trip-time">
                </div>
            </div>
            <div class="dialog-footer">
                <button onclick="hideAddTripDialog()" class="dialog-button">取消</button>
                <button onclick="addTripReminder()" class="dialog-button primary">确定</button>
            </div>
        </div>
    </div>

    <!-- 导出图片时的页脚 -->
    <div id="image-footer" style="display: none;">
        <div class="footer-content">
            <div class="footer-left">
                <img src="../UI/res/雨城通logo带文字浅色.png" alt="雨城通" class="footer-logo">
                <p class="footer-caption">时间和路线仅供参考,"临东"及相关组织品牌等均为虚构</p>
            </div>
            <div class="footer-right">
                <img src="../UI/res/qrcode.png" alt="二维码" class="footer-qr">
            </div>
        </div>
    </div>

    <!-- 搜索面板 -->
    <div class="search-panel hidden">
        <div class="search-header">
            <input type="text" placeholder="搜索车站或线路">
            <button class="close-search">
                <img src="../UI/res/close_black.png" alt="关闭">
            </button>
        </div>
        <div class="search-results">
            <!-- 搜索结果将通过JavaScript动态添加 -->
        </div>
    </div>

    <!-- 小屏幕下的浮动换乘面板 -->
    <div class="transfer-panel">
        <div class="transfer-inputs">
            <div class="transfer-input-group">
                <label>起点站</label>
                <input type="text" id="mobile-start-station" placeholder="输入起点站">
            </div>
            <div class="transfer-input-group">
                <label>终点站</label>
                <input type="text" id="mobile-end-station" placeholder="输入终点站">
            </div>
        </div>
        <div class="transfer-buttons">
            <button class="transfer-button" id="mobile-search-transfer">查找路线</button>
            <button class="transfer-button secondary" id="mobile-clear-transfer">清空</button>
        </div>
        <div class="transfer-results"></div>
    </div>

    <!-- 先加载数据文件 -->
    <script src="../data/metro_station_detail.js"></script>
    <script src="../data/bus_data.js" type="module"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="script.js" type="module"></script>
    <script src="../UI/toast.js"></script>
    <script src="../UI/footer.js"></script>
</body>
</html>
