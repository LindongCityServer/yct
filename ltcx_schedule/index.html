<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车站大屏</title>
    <link rel="icon" href="../UI/res/雨城通logo绿.png" type="image/png">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../mainpage.css">
    <link rel="stylesheet" href="../UI/toast.css">
    <link rel="stylesheet" href="../data_composer/style.css">
    <link rel="stylesheet" href="style.css">
    <style>
        #route-table thead tr {
            text-align: left;
        }

        #route-table thead th:nth-child(2) {
            position: relative;
        }

        #route-table thead th:nth-child(2)::after {
            content: '';
            display: inline-block;
            width: 18px; /* 与 .next-day 的宽度相同 */
        }
    </style>
</head>
<body>
    <!-- 标题栏 -->
    <header class="header">
        <button class="icon-button" id="back-to-home" onclick="window.location.href='../'" title="雨城通首页">
            <img src="../UI/res/雨城通logo绿.png" alt="雨城通首页">
        </button>
        <h1>车站大屏</h1>
        <div class="header-controls">
            <div class="station-group">
                <select id="station-select" class="station-select">
                    <option value="">选择车站</option>
                </select>
                <button id="direction-toggle" class="direction-toggle" title="切换方向">
                    <span class="direction-text">出发</span>
                    <img src="../UI/res/swap_horiz_black.png" alt="切换方向" class="direction-icon">
                </button>
                <select id="status-select" class="status-select">
                    <option value="all">全部</option>
                    <option value="ready">候车</option>
                    <option value="boarding">检票</option>
                    <option value="stop">停止检票</option>
                    <option value="stopped">临时停运</option>
                </select>
            </div>
        </div>
        <div class="toolbar">
            <button class="icon-button" id="search-button" title="搜索">
                <img src="../UI/res/search_black.png" alt="搜索">
            </button>
        </div>
    </header>

    <!-- 车次信息展示区 -->
    <div class="route-display">
        <table id="route-table">
            <thead>
                <tr>
                    <th>班次</th>
                    <th>发车时间</th>
                    <th>线路</th>
                    <th>途径站点</th>
                    <th>检票口</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody id="route-list">
                <!-- 车次信息将通过 JavaScript 动态插入 -->
            </tbody>
        </table>
        <!-- 无班次时显示的提示 -->
        <div id="no-routes-message" class="no-routes-message" style="display: none;">
            该站暂无班次信息
        </div>
        <section class="caption-section" style="max-width: 1200px; margin: 0 auto;"></section>
    </div>

    <!-- Toast提示 -->
    <div class="toast-overlay">
        <p class="toast-text"></p>
    </div>
    
    <!-- 搜索框 -->
    <div class="search-overlay">
        <div class="search-container">
            <input type="text" id="search-input" placeholder="搜索车次编号...">
            <div class="search-navigation">
                <button class="icon-button" id="prev-result" title="上一个结果" disabled>
                    <img src="../UI/res/arrow_upward_black.png" alt="上一个">
                </button>
                <span class="search-count">0/0</span>
                <button class="icon-button" id="next-result" title="下一个结果" disabled>
                    <img src="../UI/res/arrow_downward_black.png" alt="下一个">
                </button>
            </div>
            <button class="icon-button" id="close-search">
                <img src="../UI/res/close_black.png" alt="关闭">
            </button>
        </div>
    </div>  

    <script src="../UI/toast.js"></script>
    <script src="script.js" type="module"></script>
    <script src="../UI/footer.js"></script>
</body>
</html>
