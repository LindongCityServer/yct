<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容详情 - 雨城通</title>
    <link rel="icon" href="../UI/res/雨城通logo绿.png" type="image/png">
    <link rel="stylesheet" href="../mainpage.css" />
    <link rel="stylesheet" href="../data_composer/style.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../UI/toast.css" />
</head>
<body>
    <!-- 头部导航栏 -->
    <header class="header">
        <button class="icon-button" id="back-to-home" onclick="window.location.href='../'" title="雨城通首页">
            <img src="../UI/res/雨城通logo绿.png" alt="雨城通首页">
        </button>
        <h1>临北巴士3月发车时间参考</h1>
        <div class="toolbar">            
            <button class="icon-button" id="copy" onclick="" title="复制链接">
                <img src="../UI/res/link_black.png" alt="复制链接">
            </button>
        </div>
    </header>

    <!-- 主要内容区 -->
    <div class="content-container">
        <section>
            <h2>155路</h2>
            <p>为方便广大乘客候车，现公布3月临东临北巴士155路发车时刻表（部分）以供参考。</p>
            <img src="../data/content_banner/155路3月时刻表.jpg">
        </section>
        <section>
            <h2>181路</h2>
            <p>为方便乘车，实现绿色出行，现公布3月临北巴士开发区车队181路青咀子日间发车计划（暂定）</p>
            <img src="../data/content_banner/181路3月时刻表.jpg">
        </section>
        <section>
            <p>时刻表仅供发车参考，日常运营中会根据实际运营情况临时调点，推荐提前5-10分钟候车！</p>
        </section>
        <section class="caption-section">
            <p class="caption">"临东""临东服务器"及其相关的各类组织、品牌均为虚构，其本体基于一个《我的世界》基岩版（Minecraft Bedrock Edition）服务器。</p>
            <p class="caption">网站部分代码使用AI生成，部分图标来自<a href="https://www.icons8.com/">Icons8</a>。</p>
        </section>
    </div>
    
</body>
<script src="script.js"></script>
<script src="../UI/toast.js"></script>
</html>
